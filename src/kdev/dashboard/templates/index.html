<!doctype html>
<!-- kdev dashboard template (P8). render.py substitutes {{TITLE}} {{GENERATED}} {{HOME}} {{BODY}} {{DATA_JSON}}
     in one pass. Self-contained: no external scripts, styles or fonts; works without JavaScript. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #ffffff; --surface: #f6f7f9; --fg: #1b1f24; --muted: #5f6b7a; --line: #dde2e8; --accent: #2f5fd0;
    --good-bg: #e3f4e8; --good-fg: #1d6b34; --warn-bg: #fdf1d8; --warn-fg: #7a4d00;
    --bad-bg: #fbe3e1; --bad-fg: #a1261b; --info-bg: #e5edfb; --info-fg: #24489c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111418; --surface: #1a1f25; --fg: #e4e8ee; --muted: #93a0b0; --line: #2c333c; --accent: #86a8f5;
      --good-bg: #173523; --good-fg: #8fdca6; --warn-bg: #3a2c10; --warn-fg: #f2c46b;
      --bad-bg: #401c19; --bad-fg: #f39b91; --info-bg: #1c2a47; --info-fg: #a9c2f7;
    }
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         margin: 0 auto; padding: 16px; max-width: 1400px; }
  header { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 16px; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  h3 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  nav { position: sticky; top: 0; background: var(--bg); padding: 8px 0; display: flex; flex-wrap: wrap;
        gap: 6px 14px; align-items: center; border-bottom: 1px solid var(--line); z-index: 2; }
  nav a { color: var(--accent); text-decoration: none; }
  nav input { margin-left: auto; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px;
              background: var(--surface); color: var(--fg); min-width: 180px; }
  .muted { color: var(--muted); } .small { font-size: 12px; }
  .tw { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--muted); font-size: 12px; cursor: pointer; user-select: none;
       white-space: nowrap; background: var(--surface); }
  th.sorted-asc::after { content: " \25B2"; } th.sorted-desc::after { content: " \25BC"; }
  td.num, th.num { text-align: right; }
  tbody tr:hover { background: var(--surface); }
  code { font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; }
  .pill { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 12px; line-height: 18px;
          white-space: nowrap; background: var(--surface); color: var(--muted); }
  .pill.good { background: var(--good-bg); color: var(--good-fg); }
  .pill.good::before { content: "\2713 "; }
  .pill.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .pill.warn::before { content: "! "; }
  .pill.bad { background: var(--bad-bg); color: var(--bad-fg); }
  .pill.bad::before { content: "\2715 "; }
  .meter { display: inline-block; width: 80px; height: 8px; border-radius: 4px; background: var(--surface);
           border: 1px solid var(--line); vertical-align: middle; overflow: hidden; }
  .meter > span { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
  ul.warnings { background: var(--warn-bg); color: var(--warn-fg); border-radius: 6px; padding: 8px 8px 8px 28px; }
  details { margin: 8px 0; } summary { cursor: pointer; padding: 4px 0; }
</style>
</head>
<body>
<header>
  <h1>{{TITLE}}</h1>
  <span class="muted small">generated <span class="age" data-utc="{{GENERATED}}">{{GENERATED}}</span> UTC
  &middot; KDEV_HOME {{HOME}} &middot; data: dashboard.json</span>
</header>
{{BODY}}
<script id="kdev-data" type="application/json">{{DATA_JSON}}</script>
<script>
(function () {
  "use strict";
  // relative ages ("12m ago") from ISO-8601 UTC stamps; the stamp stays in the title attribute
  function ago(iso) {
    var t = Date.parse(iso);
    if (isNaN(t)) return "";
    var s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 90) return Math.round(s) + "s ago";
    if (s < 5400) return Math.round(s / 60) + "m ago";
    if (s < 172800) return (s / 3600).toFixed(1) + "h ago";
    return Math.round(s / 86400) + "d ago";
  }
  document.querySelectorAll(".age").forEach(function (el) {
    var iso = el.getAttribute("data-utc");
    if (!iso || iso === "None") return;
    el.title = iso;
    el.textContent = ago(iso) || iso;
  });
  // click-to-sort tables
  function key(td) {
    var t = (td.textContent || "").trim().replace(/^x/, "").replace(/%$/, "");
    var n = parseFloat(t);
    return isNaN(n) || !/^-?[\d.]/.test(t) ? t.toLowerCase() : n;
  }
  document.querySelectorAll("table.sortable").forEach(function (tbl) {
    tbl.querySelectorAll("th").forEach(function (th, i) {
      th.addEventListener("click", function () {
        var asc = !th.classList.contains("sorted-asc");
        tbl.querySelectorAll("th").forEach(function (h) { h.classList.remove("sorted-asc", "sorted-desc"); });
        th.classList.add(asc ? "sorted-asc" : "sorted-desc");
        var body = tbl.tBodies[0];
        Array.prototype.slice.call(body.rows).sort(function (a, b) {
          var x = key(a.cells[i]), y = key(b.cells[i]);
          if (typeof x !== typeof y) { x = String(x); y = String(y); }
          return (x < y ? -1 : x > y ? 1 : 0) * (asc ? 1 : -1);
        }).forEach(function (r) { body.appendChild(r); });
      });
    });
  });
  // one filter box for every table
  var f = document.getElementById("filter");
  if (f) f.addEventListener("input", function () {
    var q = f.value.toLowerCase();
    document.querySelectorAll("table.sortable tbody tr").forEach(function (r) {
      r.style.display = !q || r.textContent.toLowerCase().indexOf(q) >= 0 ? "" : "none";
    });
  });
})();
</script>
</body>
</html>
