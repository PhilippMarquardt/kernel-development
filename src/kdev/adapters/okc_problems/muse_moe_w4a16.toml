case = { bs = 128, sharding = "ep8", dist = "skewed" }

[[tests]]
id = "t4"
case = { bs = 1, sharding = "ep8" }

[[extra]]
id = "x0"
case = { bs = 2, sharding = "ep8" }

[[extra]]
id = "x1"
case = { bs = 12, sharding = "ep8" }

[[extra]]
id = "x2"
case = { bs = 24, sharding = "ep8" }

[[extra]]
id = "x3"
case = { bs = 48, sharding = "ep8" }

[[extra]]
id = "x4"
case = { bs = 64, sharding = "ep8" }

[[extra]]
id = "x5"
case = { bs = 200, sharding = "ep8" }

[[extra]]
id = "x6"
case = { bs = 32, sharding = "ep8", dist = "skewed" }

[[extra]]
