case = { bs = 8, sharding = "ep8", dist = "skewed" }

[comply]
precision = { activations = "bf16 where SGLang keeps bf16", weights = "NVFP4 stored losslessly", output = "bf16" }
forbid_patterns = ['\.item\(\)', '\.cpu\(\)', '\.tolist\(\)', '\.numpy\(\)', 'torch\.cuda\.synchronize', '\.synchronize\(\)', 'print\([^)]*(data|out|tensor)']
no_cross_call_state = true
graph_capturable = true
lossless_weights = true
notes = ["Only routes to local experts (0-31, ep8) are computed; rank='busiest' routing.", "Weights: repack in prepare(), lossless compression allowed, never a different precision."]

[comply.every_key]
enabled = false
