# muse_prefill_layer: generated from TASK.md 'Shapes' table, the OKC API benchmark list (task seeds), the
# judge's per-shape run counts and the local harness TESTS/EXTRA lists. Owner: P7. Edit by hand.
schema = "kdev.okc_problem/1"
problem = "muse_prefill_layer"
gpu = "h200"
kernel_fn_args = 2   # 1: kernel_fn(data); 2: kernel_fn(data, prepare(weights))
check_style = "collect"   # collect: check_implementation(data, collect(data, out)[, w])
weights = true   # reference.generate_weights(WEIGHTS_SEED) -> prepare()
case_fields = true   # reference.case_fields(case, weights) merged per input
default_seed = 1234
input_variance = { routing = true, lengths = false }
search_dirs = ["/root/okc/muse_prefill_layer/muse_prefill_layer", "~/okc/muse_prefill_layer/muse_prefill_layer"]
sglang_us = 387403.9

[protocol]
overhead_us = 4.0
flush = "read"
judge_reps = 6
pairing = "order_swapped_pairs"
score = "load_weighted_geomean"
budget_s = 900
prepare_budget_s = 300

[[shapes]]
id = "t1/sliding"
load = "turn 1"
weight = 46
seed = 1001
repeats = 6
floor_us = 257.0
case = { batch = 1, ctx = 80000, layer = "sliding", q_len = 753, page = 1, dist = "soft" }

[[shapes]]
id = "t1/full"
load = "turn 1"
weight = 16
