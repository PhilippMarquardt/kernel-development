[comply]
precision = { router = "fp32 at T<=8 (BF16 hi+lo pair with FP32 accumulation allowed above 8 tokens)", kv_cache = "fp8_e4m3", queries = "bf16, or fp8_e4m3 (no coarser)", activations = "bf16 where SGLang keeps bf16", weights = "stored losslessly (NVFP4 stays NVFP4, BF16 stays BF16, router FP32)" }
forbid_patterns = ['\.item\(\)', '\.cpu\(\)', '\.tolist\(\)', '\.numpy\(\)', 'torch\.cuda\.synchronize', '\.synchronize\(\)', 'print\([^)]*(data|out|tensor)']
no_cross_call_state = true
graph_capturable = true
lossless_weights = true
notes = ["Prefill: own board; inputs/outputs/bounds/routing check as muse_decode_layer.", "Every key attended (no sparse / block-skipping attention)."]

[comply.every_key]
enabled = true

[comply.routing]   # router precision probe (LESSONS 5): fp32 router at T <= fp32_max_tokens
ids_output = 2
fp32_max_tokens = 8
gap_tol = 0.0001
probe_shapes = ["t1/sliding", "t1/full"]
