[comply]
precision = { kv_cache = "fp8_e4m3", queries = "bf16, or fp8_e4m3 (no coarser)", activations = "bf16 where SGLang keeps bf16" }
forbid_patterns = ['\.item\(\)', '\.cpu\(\)', '\.tolist\(\)', '\.numpy\(\)', 'torch\.cuda\.synchronize', '\.synchronize\(\)', 'print\([^)]*(data|out|tensor)']
no_cross_call_state = true
graph_capturable = true
lossless_weights = false
notes = ["Every key: attend the whole 2,048-token window (sliding) / whole context (full); no top-k, sparse or block-skipping attention, no skipping values by attention weight.", "kernel_fn writes the new FP8 cache entries into data['k_cache']/['v_cache'] (checked via collect).", "Fresh inputs every call: nothing derived from data may be cached."]

[comply.every_key]
enabled = true
