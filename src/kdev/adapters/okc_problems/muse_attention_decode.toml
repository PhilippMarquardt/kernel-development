# muse_attention_decode: generated from TASK.md 'Shapes' table, the OKC API benchmark list (task seeds), the
# judge's per-shape run counts and the local harness TESTS/EXTRA lists. Owner: P7. Edit by hand.
schema = "kdev.okc_problem/1"
problem = "muse_attention_decode"
gpu = "h200"
kernel_fn_args = 1   # 1: kernel_fn(data); 2: kernel_fn(data, prepare(weights))
check_style = "collect"   # collect: check_implementation(data, collect(data, out)[, w])
weights = false   # reference.generate_weights(WEIGHTS_SEED) -> prepare()
case_fields = false   # reference.case_fields(case, weights) merged per input
default_seed = 1234
input_variance = { routing = false, lengths = true }
search_dirs = ["/root/okc/muse_attention_decode/muse_attention_decode", "~/okc/muse_attention_decode/muse_attention_decode"]
sglang_us = 3766.3

[protocol]
overhead_us = 4.0
flush = "read"
judge_reps = 60
pairing = "order_swapped_pairs"
score = "load_weighted_geomean"
budget_s = 900
prepare_budget_s = 300

[[shapes]]
id = "d1/sliding"
load = "decode 1"
weight = 46
seed = 601
repeats = 60
floor_us = 0.1
case = { batch = 1, ctx = 80000, heads = "tp8", layer = "sliding", page = 1, dist = "soft" }

