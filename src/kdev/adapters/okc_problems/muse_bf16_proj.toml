# muse_bf16_proj: generated from TASK.md 'Shapes' table, the OKC API benchmark list (task seeds), the
# judge's per-shape run counts and the local harness TESTS/EXTRA lists. Owner: P7. Edit by hand.
schema = "kdev.okc_problem/1"
problem = "muse_bf16_proj"
gpu = "h200"
kernel_fn_args = 2   # 1: kernel_fn(data); 2: kernel_fn(data, prepare(weights))
check_style = "direct"   # collect: check_implementation(data, collect(data, out)[, w])
weights = true   # reference.generate_weights(WEIGHTS_SEED) -> prepare()
case_fields = false   # reference.case_fields(case, weights) merged per input
default_seed = 1234
input_variance = { routing = false, lengths = false }
search_dirs = ["/root/okc/muse_bf16_proj/muse_bf16_proj", "~/okc/muse_bf16_proj/muse_bf16_proj"]
sglang_us = 4830.8

[protocol]
overhead_us = 4.0
flush = "read"
judge_reps = 60
pairing = "order_swapped_pairs"
score = "load_weighted_geomean"
budget_s = 900
prepare_budget_s = 300

