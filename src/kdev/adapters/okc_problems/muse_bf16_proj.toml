[comply]
precision = { router = "fp32 weights and output (BF16 hi+lo pair with FP32 accumulation allowed)", weights = "bf16 stored losslessly", activations = "bf16" }
forbid_patterns = ['\.item\(\)', '\.cpu\(\)', '\.tolist\(\)', '\.numpy\(\)', 'torch\.cuda\.synchronize', '\.synchronize\(\)', 'print\([^)]*(data|out|tensor)']
no_cross_call_state = true
graph_capturable = true
lossless_weights = true
notes = ["Probe rows (one nonzero power-of-two input) must be exact to 0.1%: weights at their own precision.", "unpooler at m<=8 computes only the first 1024 output columns."]

[comply.every_key]
enabled = false
