[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kdev"
version = "0.1.0"
description = "Agent-facing GPU kernel development toolkit: judge-faithful timing, SASS analysis, GPU job service, ledger"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Philipp Marquardt" }]
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
stats = ["numpy>=1.24"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
kdev = "kdev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kdev = ["*.sql", "**/*.sql", "**/*.cuh", "**/*.toml", "**/*.html", "**/*.md", "data/gpus/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "gpu: needs CUDA + torch on a GPU host (skipped unless KDEV_GPU_TESTS=1)",
  "slow: long-running test",
  "network: needs network/ssh/okc",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
